<text x="24" y="32" font-size="18" font-weight="bold" fill="#FFFFFF" letter-spacing="0.3">Choose How to Connect Your Agents</text>
<text x="24" y="52" font-size="11" fill="#8AACCC">The connection depends on where the agent runs, and sets whether it can block</text>
<text x="420" y="104" font-size="13" fill="#0A2347" text-anchor="middle" font-weight="bold">Where does the agent run?</text>
