<rect x="24" y="152" width="192" height="30" rx="8" fill="#075F68"/><rect x="24" y="172" width="192" height="10" fill="#075F68"/>
<text x="120.0" y="171.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Enterprise AI platform</text>
<text x="120.0" y="204" font-size="10" fill="#1A2A3A" text-anchor="middle">Copilot Studio, M365 Copilot,</text>
<text x="120.0" y="219" font-size="10" fill="#1A2A3A" text-anchor="middle">Foundry, ChatGPT Enterprise,</text>
<text x="120.0" y="234" font-size="10" fill="#1A2A3A" text-anchor="middle">Claude Enterprise, Gemini,</text>
<text x="120.0" y="249" font-size="10" fill="#1A2A3A" text-anchor="middle">Bedrock</text>
<line x1="120.0" y1="282" x2="120.0" y2="312" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="120.0,312.0 116.1,303.9 123.9,303.9" fill="#B0C8E0"/>
<rect x="24" y="314" width="192" height="128" rx="8" fill="#EEF4FA" stroke="#09A8B8" stroke-width="1.5"/>
<text x="120.0" y="338" font-size="12" fill="#0A2347" text-anchor="middle" font-weight="bold">API integration</text>
<text x="120.0" y="362" font-size="9.5" fill="#1A2A3A" text-anchor="middle">Platform APIs. No gateway needed.</text>
<line x1="120.0" y1="444" x2="120.0" y2="474" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="120.0,474.0 116.1,465.9 123.9,465.9" fill="#B0C8E0"/>
<rect x="24" y="476" width="192" height="138" rx="8" fill="#FFFFFF" stroke="#E8B04A" stroke-width="2"/>
<text x="120.0" y="498" font-size="10.5" fill="#4A6A8A" text-anchor="middle" font-weight="bold">Real-time blocking</text>
<text x="120.0" y="520" font-size="11" fill="#0A2347" text-anchor="middle" font-weight="bold">Copilot Studio</text>
<text x="120.0" y="537" font-size="10" fill="#7A4A00" text-anchor="middle">Tool calls only, when</text>
<text x="120.0" y="551" font-size="10" fill="#7A4A00" text-anchor="middle">enabled</text>
<text x="120.0" y="579" font-size="11" fill="#0A2347" text-anchor="middle" font-weight="bold">All other platforms</text>
<text x="120.0" y="596" font-size="10" fill="#8A1F1F" text-anchor="middle">Cannot block</text>
