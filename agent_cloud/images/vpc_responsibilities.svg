<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" font-family="Segoe UI, Calibri, Arial, sans-serif">
<rect width="840" height="520" fill="#F4F7FA" rx="12"/>
<rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/><rect x="0" y="60" width="840" height="12" fill="#0A2347"/><rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
<text x="24" y="32" font-size="18" font-weight="bold" fill="#FFFFFF" letter-spacing="0.3">Who Does What in a Customer-Hosted Data Plane</text>
<text x="24" y="52" font-size="11" fill="#8AACCC">AWS VPC and Azure VNet deployment models</text>
<rect x="24" y="92" width="792" height="132" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<rect x="24" y="92" width="792" height="30" rx="8" fill="#075F68"/><rect x="24" y="112" width="792" height="10" fill="#075F68"/>
<text x="420.0" y="111.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rubrik</text>
<rect x="40" y="134" width="240" height="74" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="160" y="156" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Operates the data plane software</text>
<text x="160" y="176" font-size="10" fill="#4A6A8A" text-anchor="middle">Rubrik operates the software;</text>
<text x="160" y="190" font-size="10" fill="#4A6A8A" text-anchor="middle">the infrastructure is yours</text>
<rect x="300" y="134" width="240" height="74" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="420" y="156" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Completes the deployment</text>
<text x="420" y="176" font-size="10" fill="#4A6A8A" text-anchor="middle">Rubrik Support finishes the</text>
<text x="420" y="190" font-size="10" fill="#4A6A8A" text-anchor="middle">deployment after you run the template</text>
<rect x="560" y="134" width="240" height="74" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="680" y="156" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Receives only metadata</text>
<text x="680" y="176" font-size="10" fill="#4A6A8A" text-anchor="middle">Metadata and policy results, plus</text>
<text x="680" y="190" font-size="10" fill="#4A6A8A" text-anchor="middle">system metrics and debug logs</text>
<rect x="24" y="244" width="792" height="246" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<rect x="24" y="244" width="792" height="30" rx="8" fill="#0C3460"/><rect x="24" y="264" width="792" height="10" fill="#0C3460"/>
<text x="420.0" y="263.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You</text>
<rect x="40" y="286" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="160" y="310" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Run the Rubrik template</text>
<text x="160" y="332" font-size="10" fill="#4A6A8A" text-anchor="middle">CloudFormation on AWS,</text>
<text x="160" y="346" font-size="10" fill="#4A6A8A" text-anchor="middle">the Azure template on Azure</text>
<rect x="300" y="286" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="420" y="310" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Pay infrastructure costs</text>
<text x="420" y="332" font-size="10" fill="#4A6A8A" text-anchor="middle">Billed to your AWS account</text>
<text x="420" y="346" font-size="10" fill="#4A6A8A" text-anchor="middle">or Azure subscription</text>
<rect x="560" y="286" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="680" y="310" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Manage service quotas</text>
<text x="680" y="332" font-size="10" fill="#4A6A8A" text-anchor="middle">Insufficient quotas cause</text>
<text x="680" y="346" font-size="10" fill="#4A6A8A" text-anchor="middle">workloads to fail</text>
<rect x="40" y="382" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="160" y="406" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Keep the deployment intact</text>
<text x="160" y="428" font-size="10" fill="#4A6A8A" text-anchor="middle">Do not delete or alter the stack</text>
<text x="160" y="442" font-size="10" fill="#4A6A8A" text-anchor="middle">or the Azure resource group</text>
<rect x="300" y="382" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="420" y="406" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Secure the account</text>
<text x="420" y="428" font-size="10" fill="#4A6A8A" text-anchor="middle">Security and access controls,</text>
<text x="420" y="442" font-size="10" fill="#4A6A8A" text-anchor="middle">including user permissions</text>
<rect x="560" y="382" width="240" height="82" rx="8" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
<text x="680" y="406" font-size="11.5" fill="#0A2347" text-anchor="middle" font-weight="bold">Follow official deprovisioning</text>
<text x="680" y="428" font-size="10" fill="#4A6A8A" text-anchor="middle">Contact Rubrik Support to avoid</text>
<text x="680" y="442" font-size="10" fill="#4A6A8A" text-anchor="middle">orphaned resources and costs</text>
<rect x="0" y="498" width="840" height="22" fill="#0A2347"/><rect x="0" y="498" width="840" height="22" fill="#0A2347" rx="12"/><rect x="0" y="498" width="840" height="12" fill="#0A2347"/>
<text x="24" y="512" font-size="9" fill="#8AACCC">Rubrik Security Cloud — Agent Cloud shared responsibility</text>
<rect width="840" height="520" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/></svg>
