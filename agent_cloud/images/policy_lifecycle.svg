<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Calibri, Arial, sans-serif">
<rect width="840" height="560" fill="#F4F7FA" rx="12"/>
<rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/><rect x="0" y="60" width="840" height="12" fill="#0A2347"/><rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
<text x="24" y="32" font-size="18" font-weight="bold" fill="#FFFFFF" letter-spacing="0.3">Policy Lifecycle</text>
<text x="24" y="52" font-size="11" fill="#8AACCC">From understanding policies to triaging what they find</text>
<rect x="24" y="96" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="46" cy="120" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="46" y="125" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">1</text>
<text x="66" y="125" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Understand policies</text>
<text x="144" y="152" font-size="10" fill="#4A6A8A" text-anchor="middle">Effect, rule, scope,</text>
<text x="144" y="166" font-size="10" fill="#4A6A8A" text-anchor="middle">severity, and source</text>
<rect x="300" y="96" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="322" cy="120" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="322" y="125" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">2</text>
<text x="342" y="125" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Plan your rollout</text>
<text x="420" y="152" font-size="10" fill="#4A6A8A" text-anchor="middle">Start in Monitor</text>
<rect x="576" y="96" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="598" cy="120" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="598" y="125" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">3</text>
<text x="618" y="125" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Choose a mode</text>
<text x="696" y="152" font-size="10" fill="#4A6A8A" text-anchor="middle">Monitor or Block</text>
<line x1="264" y1="138" x2="300" y2="138" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="300.0,138.0 291.9,141.9 291.9,134.1" fill="#B0C8E0"/>
<line x1="540" y1="138" x2="576" y2="138" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="576.0,138.0 567.9,141.9 567.9,134.1" fill="#B0C8E0"/>
<rect x="440" y="208" width="182" height="82" rx="8" fill="#E8F7F0" stroke="#21AA7A" stroke-width="1.5"/>
<text x="531" y="232" font-size="12" fill="#0A4030" text-anchor="middle" font-weight="bold">Monitor</text>
<text x="531" y="252" font-size="10" fill="#1A2A3A" text-anchor="middle">Records alerts and violations</text>
<text x="531" y="266" font-size="10" fill="#1A2A3A" text-anchor="middle">Start here</text>
<rect x="634" y="208" width="182" height="82" rx="8" fill="#FDECEC" stroke="#B03030" stroke-width="1.5"/>
<text x="725" y="232" font-size="12" fill="#8A1F1F" text-anchor="middle" font-weight="bold">Block</text>
<text x="725" y="252" font-size="10" fill="#1A2A3A" text-anchor="middle">Stops the action, on</text>
<text x="725" y="266" font-size="10" fill="#1A2A3A" text-anchor="middle">connections that support it</text>
<line x1="660" y1="180" x2="531" y2="208" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="531.0,208.0 538.1,202.5 539.7,210.1" fill="#B0C8E0"/>
<line x1="740" y1="180" x2="725" y2="208" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="725.0,208.0 725.4,199.0 732.3,202.7" fill="#B0C8E0"/>
<rect x="576" y="330" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="598" cy="354" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="598" y="359" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">4</text>
<text x="618" y="359" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Add system policies</text>
<text x="696" y="386" font-size="10" fill="#4A6A8A" text-anchor="middle">Or policy packs. Not enabled</text>
<text x="696" y="400" font-size="10" fill="#4A6A8A" text-anchor="middle">by default</text>
<rect x="300" y="330" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="322" cy="354" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="322" y="359" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">5</text>
<text x="342" y="359" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Add custom policies</text>
<text x="420" y="386" font-size="10" fill="#4A6A8A" text-anchor="middle">Natural language. New</text>
<text x="420" y="400" font-size="10" fill="#4A6A8A" text-anchor="middle">policies start in Monitor</text>
<rect x="24" y="330" width="240" height="84" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<circle cx="46" cy="354" r="13" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2"/>
<text x="46" y="359" font-size="13" fill="#09A8B8" text-anchor="middle" font-weight="bold">6</text>
<text x="66" y="359" font-size="12" fill="#0A2347" text-anchor="start" font-weight="bold">Triage</text>
<text x="144" y="386" font-size="10" fill="#4A6A8A" text-anchor="middle">Alerts and violations,</text>
<text x="144" y="400" font-size="10" fill="#4A6A8A" text-anchor="middle">prioritized by severity</text>
<line x1="531" y1="290" x2="650" y2="330" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="650.0,330.0 641.1,331.1 643.6,323.7" fill="#B0C8E0"/>
<line x1="725" y1="290" x2="740" y2="330" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="740.0,330.0 733.5,323.8 740.8,321.0" fill="#B0C8E0"/>
<line x1="576" y1="372" x2="540" y2="372" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="540.0,372.0 548.1,368.1 548.1,375.9" fill="#B0C8E0"/>
<line x1="300" y1="372" x2="264" y2="372" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="264.0,372.0 272.1,368.1 272.1,375.9" fill="#B0C8E0"/>
<rect x="24" y="456" width="792" height="72" rx="8" fill="#FFF4E5" stroke="#E8B04A" stroke-width="1.5"/>
<text x="420" y="484" font-size="13" fill="#7A4A00" text-anchor="middle" font-weight="bold">Blocking fails open, and most connections cannot block.</text>
<text x="420" y="506" font-size="10.5" fill="#7A4A00" text-anchor="middle">If Agent Cloud cannot decide in time, the action proceeds. Check tool blocking support before you choose Block.</text>
<rect x="0" y="538" width="840" height="22" fill="#0A2347"/><rect x="0" y="538" width="840" height="22" fill="#0A2347" rx="12"/><rect x="0" y="538" width="840" height="12" fill="#0A2347"/>
<text x="24" y="552" font-size="9" fill="#8AACCC">Rubrik Security Cloud — Agent Cloud policy lifecycle</text>
<rect width="840" height="560" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/></svg>
