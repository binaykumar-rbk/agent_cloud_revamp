<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Calibri, Arial, sans-serif">
<rect width="840" height="560" fill="#F4F7FA" rx="12"/>
<rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/><rect x="0" y="60" width="840" height="12" fill="#0A2347"/><rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
<text x="24" y="32" font-size="18" font-weight="bold" fill="#FFFFFF" letter-spacing="0.3">How Agent Rewind Works</text>
<text x="24" y="52" font-size="11" fill="#8AACCC">A rewind needs a complete Rubrik snapshot taken within seven days before the action</text>
<line x1="40" y1="170" x2="800" y2="170" stroke="#0A2347" stroke-width="3"/>
<polygon points="800.0,170.0 791.9,173.9 791.9,166.1" fill="#0A2347"/>
<rect x="200" y="134" width="340" height="28" rx="8" fill="#E8F7F0" stroke="#21AA7A" stroke-width="1.5"/>
<text x="370" y="153" font-size="10.5" fill="#0A4030" text-anchor="middle" font-weight="bold">Snapshot window: up to 7 days before the action</text>
<circle cx="340" cy="170" r="9" fill="#21AA7A"/>
<text x="340" y="200" font-size="10.5" fill="#0A4030" text-anchor="middle" font-weight="bold">Latest complete snapshot</text>
<text x="340" y="215" font-size="10" fill="#4A6A8A" text-anchor="middle">in the window</text>
<circle cx="540" cy="170" r="9" fill="#B03030"/>
<text x="540" y="200" font-size="10.5" fill="#8A1F1F" text-anchor="middle" font-weight="bold">Agent action</text>
<text x="540" y="215" font-size="10" fill="#4A6A8A" text-anchor="middle">changes your data</text>
<circle cx="700" cy="170" r="9" fill="#09A8B8"/>
<text x="700" y="200" font-size="10.5" fill="#0A2347" text-anchor="middle" font-weight="bold">You rewind</text>
<text x="700" y="215" font-size="10" fill="#4A6A8A" text-anchor="middle">after confirming the plan</text>
<rect x="24" y="240" width="792" height="64" rx="8" fill="#FFF4E5" stroke="#E8B04A" stroke-width="1.5"/>
<text x="420" y="266" font-size="12" fill="#7A4A00" text-anchor="middle" font-weight="bold">No Rubrik protection, or no qualifying snapshot: the rewind cannot proceed.</text>
<text x="420" y="286" font-size="10.5" fill="#7A4A00" text-anchor="middle">Confirm that the workloads your agents change are protected before you rely on Rewind.</text>
<text x="420" y="336" font-size="12" fill="#0A2347" text-anchor="middle" font-weight="bold">Three levels of rewind</text>
<rect x="24" y="350" width="256" height="120" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<rect x="24" y="350" width="256" height="30" rx="8" fill="#075F68"/><rect x="24" y="370" width="256" height="10" fill="#075F68"/>
<text x="152.0" y="369.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">One-click rewind</text>
<text x="152.0" y="402" font-size="10" fill="#1A2A3A" text-anchor="middle">Agent Rewind identifies the affected</text>
<text x="152.0" y="417" font-size="10" fill="#1A2A3A" text-anchor="middle">object and items, and shows a restore</text>
<text x="152.0" y="432" font-size="10" fill="#1A2A3A" text-anchor="middle">plan. You review it and confirm.</text>
<rect x="292" y="350" width="256" height="120" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<rect x="292" y="350" width="256" height="30" rx="8" fill="#0C3460"/><rect x="292" y="370" width="256" height="10" fill="#0C3460"/>
<text x="420.0" y="369.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Snapshot-identified rewind</text>
<text x="420.0" y="402" font-size="10" fill="#1A2A3A" text-anchor="middle">Agent Rewind finds the right snapshot</text>
<text x="420.0" y="417" font-size="10" fill="#1A2A3A" text-anchor="middle">and opens its recovery page.</text>
<text x="420.0" y="432" font-size="10" fill="#1A2A3A" text-anchor="middle">You complete the restore.</text>
<rect x="560" y="350" width="256" height="120" rx="8" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
<rect x="560" y="350" width="256" height="30" rx="8" fill="#0B3A72"/><rect x="560" y="370" width="256" height="10" fill="#0B3A72"/>
<text x="688.0" y="369.0" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Manual rewind</text>
<text x="688.0" y="402" font-size="10" fill="#1A2A3A" text-anchor="middle">You select the object and the</text>
<text x="688.0" y="417" font-size="10" fill="#1A2A3A" text-anchor="middle">snapshot yourself through the</text>
<text x="688.0" y="432" font-size="10" fill="#1A2A3A" text-anchor="middle">standard recovery workflow.</text>
<line x1="120" y1="500" x2="720" y2="500" stroke="#B0C8E0" stroke-width="1.5"/>
<polygon points="720.0,500.0 711.9,503.9 711.9,496.1" fill="#B0C8E0"/>
<text x="24" y="504" font-size="10" fill="#4A6A8A" text-anchor="start">Most automatic</text>
<text x="816" y="504" font-size="10" fill="#4A6A8A" text-anchor="end">Most manual</text>
<text x="420" y="526" font-size="10.5" fill="#1A2A3A" text-anchor="middle">The restore starts only after you confirm. A rewind changes only the items in the plan.</text>
<rect x="0" y="538" width="840" height="22" fill="#0A2347"/><rect x="0" y="538" width="840" height="22" fill="#0A2347" rx="12"/><rect x="0" y="538" width="840" height="12" fill="#0A2347"/>
<text x="24" y="552" font-size="9" fill="#8AACCC">Rubrik Security Cloud — Agent Cloud Agent Rewind</text>
<rect width="840" height="560" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/></svg>
